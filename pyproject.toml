[project]
name = "devops-toolkit"
version = "0.1.0"
description = "A small collection of practical AWS maintenance and cost-visibility CLI tools for DevOps teams"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34",
    "tabulate>=0.9",
]

[project.scripts]
ecr-cleanup = "toolkit.ecr_cleanup:main"
stale-snapshots = "toolkit.stale_snapshots:main"
cost-summary = "toolkit.cost_summary:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.ruff]
line-length = 100

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
